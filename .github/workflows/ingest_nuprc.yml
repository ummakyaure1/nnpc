name: Scheduled Regulatory Ingestion Pipeline

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  run-ingestion-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pypdf anthropic

      - name: Execute Scraper Pipeline Script
        env:
          APP_INGESTION_URL: ${{ secrets.APP_INGESTION_URL }}
          INGESTION_SECRET_KEY: ${{ secrets.INGESTION_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: |
          python scripts/ingest_nuprc.py
