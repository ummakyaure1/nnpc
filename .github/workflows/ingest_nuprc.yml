name: Scheduled Regulatory Ingestion Pipeline

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC (07:00 WAT)
  workflow_dispatch:
    inputs:
      pdf_url:
        description: 'Optional: PDF links or NUPRC report pages, comma-separated. Blank = crawl the /reports archive.'
        required: false
        default: ''
      max_reports:
        description: 'How many of the newest matching reports to process (raise for a backfill).'
        required: false
        default: '1'
      dry_run:
        description: 'Discovery only: list the PDFs found without calling Claude or posting.'
        type: boolean
        required: false
        default: false

concurrency:
  group: nuprc-ingestion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-ingestion-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.31" "pypdf>=4.0" "anthropic>=0.40" "playwright>=1.40"
          pip freeze | grep -iE '^(requests|pypdf|anthropic|playwright)=='

      - name: Install headless browser (fallback for JavaScript-rendered report pages)
        run: python -m playwright install --with-deps chromium

      - name: Execute Scraper Pipeline Script
        env:
          APP_INGESTION_URL: ${{ secrets.APP_INGESTION_URL }}
          INGESTION_SECRET_KEY: ${{ secrets.INGESTION_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-haiku-5-5' }}
          NUPRC_REPORTS_INDEX: ${{ vars.NUPRC_REPORTS_INDEX || 'https://www.nuprc.gov.ng/reports' }}
          NUPRC_REPORT_KEYWORDS: ${{ vars.NUPRC_REPORT_KEYWORDS || 'production' }}
          MAX_OUTPUT_TOKENS: ${{ vars.MAX_OUTPUT_TOKENS || '16000' }}
          NUPRC_PDF_URLS: ${{ inputs.pdf_url }}
          NUPRC_MAX_REPORTS: ${{ inputs.max_reports || vars.NUPRC_MAX_REPORTS || '1' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          python scripts/ingest_nuprc.py
