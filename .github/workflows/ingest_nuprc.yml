name: Scheduled Regulatory Ingestion Pipeline

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC (07:00 WAT)
  workflow_dispatch:
    inputs:
      pdf_url:
        description: 'Optional NUPRC PDF URL(s), comma-separated. Leave blank to auto-discover.'
        required: false
        default: ''
      dry_run:
        description: 'Discovery only: list candidate PDFs without calling Claude or posting.'
        type: boolean
        required: false
        default: false

concurrency:
  group: nuprc-ingestion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-ingestion-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.31" "pypdf>=4.0" "anthropic>=0.40"
          pip freeze | grep -iE '^(requests|pypdf|anthropic)=='

      - name: Execute Scraper Pipeline Script
        env:
          APP_INGESTION_URL: ${{ secrets.APP_INGESTION_URL }}
          INGESTION_SECRET_KEY: ${{ secrets.INGESTION_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-haiku-5-5' }}
          NUPRC_PDF_URLS: ${{ inputs.pdf_url }}
          NUPRC_LISTING_PAGES: ${{ vars.NUPRC_LISTING_PAGES }}
          NUPRC_MAX_REPORTS: ${{ vars.NUPRC_MAX_REPORTS || '1' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          python scripts/ingest_nuprc.py
