name: Automated Ingestion Pipeline

on:
  schedule:
    - cron: '0 5 * * *'    # daily 06:00 WAT: news bulletin
    - cron: '0 6 * * 1'    # Mondays 07:00 WAT: NUPRC production, NOSDRA spills, NMDPRA reports
    - cron: '0 7 1 * *'    # 1st of each month 08:00 WAT: licence register (OMLs)
  push:
    branches: [main]
    paths: ['data/reference/**']   # map files dropped into the repo
  workflow_dispatch:
    inputs:
      collectors:
        description: 'Collectors to run: all, or a comma list of nuprc, nosdra, nmdpra, news, assets, reference'
        required: false
        default: 'all'
      dry_run:
        description: 'Discovery only: list what would be collected, post nothing.'
        type: boolean
        required: false
        default: false
      max_reports:
        description: 'NUPRC: newest reports per series to process (raise for a backfill).'
        required: false
        default: '1'
      pdf_url:
        description: 'NUPRC: optional PDF links or report pages, comma-separated.'
        required: false
        default: ''

concurrency:
  group: ingestion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Choose collectors
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED: ${{ inputs.collectors }}
        run: |
          case "$EVENT" in
            push)              LIST="reference" ;;
            workflow_dispatch) LIST="${REQUESTED:-all}" ;;
            schedule)
              case "$SCHEDULE" in
                '0 5 * * *') LIST="news" ;;
                '0 6 * * 1') LIST="nuprc,nosdra,nmdpra" ;;
                '0 7 1 * *') LIST="assets" ;;
                *)           LIST="" ;;
              esac ;;
          esac
          echo "Collectors: $LIST"
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          if echo "$LIST" | grep -qE 'all|nuprc|nosdra|nmdpra|news|assets'; then echo "browser=1" >> "$GITHUB_OUTPUT"; fi

      - name: Install headless browser (for JavaScript-rendered sites)
        if: steps.pick.outputs.browser == '1'
        run: python -m playwright install --with-deps chromium

      - name: Run collectors
        if: steps.pick.outputs.list != ''
        working-directory: scripts
        env:
          APP_INGESTION_URL: ${{ secrets.APP_INGESTION_URL }}
          INGESTION_SECRET_KEY: ${{ secrets.INGESTION_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-haiku-5-5' }}
          MAX_OUTPUT_TOKENS: ${{ vars.MAX_OUTPUT_TOKENS || '32000' }}
          NUPRC_REPORTS_INDEX: ${{ vars.NUPRC_REPORTS_INDEX || 'https://www.nuprc.gov.ng/reports' }}
          NUPRC_REPORT_KEYWORDS: ${{ vars.NUPRC_REPORT_KEYWORDS || 'production' }}
          NUPRC_PDF_URLS: ${{ inputs.pdf_url }}
          NUPRC_MAX_REPORTS: ${{ inputs.max_reports || vars.NUPRC_MAX_REPORTS || '1' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          COLLECTORS: ${{ steps.pick.outputs.list }}
        run: python run_collectors.py --collectors "$COLLECTORS"
